[package]
name = "EchoMusic-Lyrics-WinIsland"
version = "1.2.13"
edition = "2024"

[workspace]
members = ["crates/host-backdrop"]
resolver = "3"

[dependencies]
cpal = "0.15"
realfft = "3.3"
bytemuck = "1.25.0"
skia-safe = { version = "0.93.1", features = ["d3d"] }
softbuffer = "0.4.8"
tray-icon = "0.19"
tauri = { version = "2", features = [] }
windows = { version = "0.58", features = ["implement", "Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Security", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Variant", "Win32_Globalization", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "UI_Notifications", "Data_Xml_Dom", ] }
windows62 = { package = "windows", version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
    "Foundation",
    "Foundation_Collections",
    "Foundation_Metadata",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Security_Authorization_AppCapabilityAccess",
] }
# windows 0.58 的 #[implement] 宏展开引用 ::windows_core 绝对路径，需与 windows 保持同版本
windows-core = "0.58"
# WinIsland 原版毛玻璃宿主背板（DWM 宿主背板画笔 + DirectComposition）
host-backdrop = { path = "crates/host-backdrop" }
winit = "0.30"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "6.0"
open = "5.3"
image = "0.25"
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0.149"
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
tokio-tungstenite = "0.27"
futures-util = "0.3"
tokio-util = "0.7"
rfd = "0.17.2"
once_cell = "1.19"
base64 = "0.22"
log = "0.4"
env_logger = "0.11"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
